name: Build

on:
  push:
    branches: ["**"]
    # Pushing a version tag (e.g. v0.1.0) also publishes a GitHub release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create releases on tag pushes
    steps:
      - uses: actions/checkout@v4
      # Pinned so new lints in a future Rust release can't break the build.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          & $makensis /V2 "/DVERSION=$version" installer\forus.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: forus-windows-x64
          path: |
            target/release/forus.exe
            target/Forus-*-setup.exe

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.installer.outputs.version }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match Cargo.toml version ${{ steps.installer.outputs.version }}"
            exit 1
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Forus ${{ steps.installer.outputs.version }}
          body_path: .github/release-notes.md
          files: |
            target/Forus-${{ steps.installer.outputs.version }}-setup.exe
            target/release/forus.exe
